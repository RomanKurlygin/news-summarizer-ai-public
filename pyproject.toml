[project]
name = "news-summarizer-ai"
version = "0.1.0"
description = "Университетский NLP-проект по суммаризации новостей и оценке качества"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio] (>=2.0.38,<2.1)",
    "asyncpg (>=0.30,<1)",
    "aiosqlite (>=0.21,<1)",
    "alembic (>=1.14,<2)",
    "pyjwt (>=2.15,<3)",
    "bcrypt (>=5,<6)",
    "email-validator (>=2.2,<3)",
    "celery[redis] (>=5.5,<6)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.rag]
optional = true

[tool.poetry.group.rag.dependencies]
sentence-transformers = "~5.2.3"
transformers = ">=4.57,<5"
lm-format-enforcer = "~0.11.3"
qdrant-client = "~1.16.2"
rank-bm25 = "0.2.2"
numpy = ">=1.26,<3"
torch = [
    { version = "2.9.1+cpu", source = "torch-cpu", markers = "sys_platform != 'darwin'" },
    { version = "2.9.1", markers = "sys_platform == 'darwin'" },
]

[[tool.poetry.source]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"
pytest-asyncio = ">=0.25,<2"
pytest-cov = ">=6,<8"

[tool.poetry.group.evaluation]
optional = true

[tool.poetry.group.evaluation.dependencies]
sacrebleu = ">=2.5,<3"
rouge-score = "~0.1.2"
nltk = ">=3.9,<4"
bert-score = "~0.3.13"

[tool.poetry.group.ui]
optional = true

[tool.poetry.group.ui.dependencies]
streamlit = ">=1.48,<2"
plotly = ">=6,<7"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = ["live_embeddings: uses real cached SentenceTransformers model when RUN_LIVE_EMBEDDINGS=1"]
